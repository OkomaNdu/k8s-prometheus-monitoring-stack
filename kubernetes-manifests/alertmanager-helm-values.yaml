alertmanager:
  alertmanagerSpec:
    # Mount the existing secrets so Alertmanager can read credentials from files
    secrets:
      - slack-auth
      - gmail-auth

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: 'email'
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 30m
      routes:
      - receiver: 'slack'
        matchers:
        - alertname=~"MysqlDown|MysqlTooManyConnections|JavaTooManyConnections"
      - receiver: 'email'
        matchers:
        - alertname=~"NginxHighHttp4xxErrorRate|KubernetesStatefulsetDown"

    receivers:
    - name: 'email'
      email_configs:
      - to: 'paulokoman@gmail.com'
        from: 'paulokoman@gmail.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'paulokoman@gmail.com'
        auth_identity: 'paulokoman@gmail.com'
        auth_password_file: /etc/alertmanager/secrets/gmail-auth/password

    - name: 'slack'
      slack_configs:
      - channel: '#prometheus-alerts'
        send_resolved: false
        api_url_file: /etc/alertmanager/secrets/slack-auth/slack_url
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] Monitoring Event Notification'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
            *Description:* {{ .Annotations.description }}
            *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
            {{ end }}
          {{ end }}

    templates:
    - '/etc/alertmanager/config/*.tmpl'
